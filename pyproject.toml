[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ethanol-intel-digest"
version = "1.0.0"
description = "Automated corn and ethanol market intelligence reports"
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "httpx>=0.27,<1",
  "jinja2>=3.1,<4",
  "markdown>=3.7,<4",
  "matplotlib>=3.9,<4",
  "openai>=3.3,<4",
  "pillow>=11,<13",
  "playwright>=1.49,<2",
  "python-dotenv>=1.0,<2",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.8,<1",
]

[project.scripts]
ethanol-report = "ethanol_report.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
packages = ["ethanol_report"]
ignore_missing_imports = true
disable_error_code = ["import-untyped"]
