name: Rebuild GitHub Pages site

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: healthcare-update-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rebuild:
    name: Rebuild and commit docs site
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - name: Check out the latest default branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install site dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .

      - name: Validate site decoration
        run: pytest tests/test_site.py

      - name: Build the static site
        run: python -m healthcare_report build-site

      - name: Commit and push the rebuilt site
        run: |
          git fetch origin "${GITHUB_REF_NAME}"
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse "origin/${GITHUB_REF_NAME}")" ]; then
            echo "::error::The branch changed while the site was building. Rerun from the new head."
            exit 1
          fi
          git add -- docs
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Rebuild GitHub Pages site"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Request the branch-based Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
